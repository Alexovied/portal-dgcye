    <rect x="40" y="556" width="300" height="30"/><rect x="340" y="556" width="150" height="30"/><rect x="490" y="556" width="150" height="30"/>
    <rect x="40" y="586" width="300" height="30"/><rect x="340" y="586" width="150" height="30"/><rect x="490" y="586" width="150" height="30"/>

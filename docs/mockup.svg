  <text x="712" y="583" fill="#fff" font-weight="bold">⬇ Descargar original</text>
  <text x="40" y="652" font-size="12">En celular: buscador arriba, calendario plegable, tarjetas a ancho completo y visor con scroll horizontal.</text>
